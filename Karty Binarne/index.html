<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Karty binarne</title>
<style>
body {
    background: #1e1e1e;
    color: white;
    text-align: center;
    font-family: Arial;
}

#sum {
    font-size: 30px;
    margin: 20px;
}

.grid {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

img {
    width: 100px;
    cursor: pointer;
}
</style>
</head>
<body>

<h1>Karty binarne</h1>
<div id="sum">0</div>

<div class="grid" id="grid"></div>

<script>
const values = [1,2,4,8,16,32,64,128];
const grid = document.getElementById("grid");
const sumText = document.getElementById("sum");

let sum = 0;

values.forEach(v => {
    let img = document.createElement("img");
    img.src = "reverse.png";

    let on = false;

    img.onclick = () => {
        on = !on;

        if(on){
            img.src = v + ".png";
            sum += v;
        } else {
            img.src = "reverse.png";
            sum -= v;
        }

        sumText.textContent = sum;
    };

    grid.appendChild(img);
});
</script>

</body>
</html>
