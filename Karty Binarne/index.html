<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Karty binarne</title>
<style>
    body {
        font-family: Arial;
        background: #1e1e1e;
        color: white;
        text-align: center;
    }

    #sum {
        font-size: 28px;
        margin-top: 20px;
    }

    .grid {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 40px;
        flex-wrap: wrap;
    }

    .card {
        width: 100px;
        text-align: center;
        cursor: pointer;
    }

    .card img {
        width: 100%;
        height: 140px;
        border-radius: 10px;
    }

    .value {
        margin-top: 8px;
        font-size: 18px;
    }
</style>
</head>
<body>

<h1>Karty binarne</h1>
<div id="sum">Suma = 0</div>

<div class="grid" id="grid"></div>

<script>
    const grid = document.getElementById("grid");
    const sumDisplay = document.getElementById("sum");

    let total = 0;

    // wartości = nazwy plików
    const values = [1, 2, 4, 8, 16, 32, 64, 128];

    values.forEach(value => {
        let card = document.createElement("div");
        card.classList.add("card");

        let img = document.createElement("img");
        img.src = "reverse.png"; // ZAKRYTA

        let revealed = false;

        card.addEventListener("click", () => {
            revealed = !revealed;

            if (revealed) {
                img.src = value + ".png"; // np. 1.png, 2.png
                total += value;
            } else {
                img.src = "reverse.png";
                total -= value;
            }

            sumDisplay.textContent = "Suma = " + total;
        });

        let label = document.createElement("div");
        label.classList.add("value");
        label.textContent = value;

        card.appendChild(img);
        card.appendChild(label);
        grid.appendChild(card);
    });
</script>

</body>
</html>
