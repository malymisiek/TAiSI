<!DOCTYPE html>
<!--Zamień z float na flex-->
<html lang="pl" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona z Float</title>
    <style>
        /* Styl nagłówka */
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Styl kontenera głównego (lewa + prawa kolumna) */
        .main {
            display: flex;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Styl menu (lewa kolumna) */
        nav {
            width: 200px;
            background-color: #f4f4f4;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Styl treści głównej (prawa kolumna) */
        .content {
            flex: 1;
            padding: 20px;
        }

        /* Styl stopki */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }

        /* Styl dla elementów w menu */
        nav ul {
            list-style-type: none;
            padding: 0;
        }

        nav ul li {
            padding: 8px;
            background-color: #ddd;
            margin-bottom: 10px;
        }

        /* Styl dla obrazka w treści */
        .content img {
            max-width: 100%;
            height: auto;
        }
    </style>

<body>
    <header>
        <h1>Strona z Float</h1>
    </header>
    
    <div class="main">
        <nav>
            <ul>
                <li>Menu 1</li>
                <li>Menu 2</li>
                <li>Menu 3</li>
            </ul>
        </nav>

        <div class="content">
            <h2>Treść główna</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Quisque sit amet accumsan arcu. Sed tincidunt magna sit amet lorem luctus, ut hendrerit arcu egestas.</p>

        </div>
    </div>
